[project]
name = "noel-secret"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []
[dependency-groups]
control = ["resend>=2", "pycountry>=24.6", "cryptography>=46", "Django>=5.2,<5.3", "django-allauth[mfa]>=65,<66", "psycopg[binary]>=3.2,<4", "waitress>=3", "whitenoise>=6"]
vault = ["pycountry>=24.6", "Django>=5.2,<5.3", "django-allauth[mfa]>=65,<66", "psycopg[binary]>=3.2,<4", "waitress>=3", "whitenoise>=6", "cryptography>=46", "resend>=2"]
dev = ["pytest>=8", "pytest-django>=4", "hypothesis>=6", "ruff>=0.12", "pip-audit>=2.9"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
markers = ["integration: requires local PostgreSQL", "privacy: boundary checks", "concurrent_db: standalone concurrent transaction case"]
[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
