# Managed exclusively by Sweetfamily staging activation.
server {
    listen 80;
    listen [::]:80;
    server_name sweetfamily.gestionatech.de;
    access_log off;
    error_log /var/log/nginx/sweetfamily-staging-error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/sweetfamily-acme; default_type text/plain; }
    location / { return 301 https://sweetfamily.gestionatech.de$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sweetfamily.gestionatech.de;
    ssl_certificate /etc/letsencrypt/live/sweetfamily.gestionatech.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sweetfamily.gestionatech.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/sweetfamily-staging-error.log crit;
    client_max_body_size 64k;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host sweetfamily.gestionatech.de;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-By "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name vault.sweetfamily.gestionatech.de;
    access_log off;
    error_log /var/log/nginx/sweetfamily-staging-error.log crit;
